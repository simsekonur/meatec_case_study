services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: meatec_mongo
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - mongo_data:/data/db
    networks:
      - meatec_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: meatec_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - meatec_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meatec_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - meatec_net

  localstack:
    image: localstack/localstack:3
    container_name: meatec_localstack
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    networks:
      - meatec_net

  # ─── Microservices ─────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: meatec_auth
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - ./auth-service/.env
    environment:
      # Override localhost values from .env with Docker-internal hostnames
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/auth_db?authSource=admin
    volumes:
      - ./auth-service/logs:/app/logs
    depends_on:
      - mongo
    networks:
      - meatec_net

  passport-service:
    build:
      context: ./passport-service
      dockerfile: Dockerfile
    container_name: meatec_passport
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - ./passport-service/.env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/passport_db?authSource=admin
      AUTH_SERVICE_URL: http://auth-service:3001
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./passport-service/logs:/app/logs
    depends_on:
      - mongo
      - kafka
      - auth-service
    networks:
      - meatec_net

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: meatec_document
    restart: unless-stopped
    ports:
      - '3003:3003'
    env_file:
      - ./document-service/.env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/document_db?authSource=admin
      AUTH_SERVICE_URL: http://auth-service:3001
      S3_ENDPOINT: http://localstack:4566
    volumes:
      - ./document-service/logs:/app/logs
    depends_on:
      - mongo
      - localstack
      - auth-service
    networks:
      - meatec_net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: meatec_notification
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./notification-service/logs:/app/logs
    depends_on:
      - kafka
      - auth-service
    networks:
      - meatec_net

volumes:
  mongo_data:
  localstack_data:

networks:
  meatec_net:
    driver: bridge
