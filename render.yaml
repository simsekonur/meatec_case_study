services:
  # ─── Auth Service ───────────────────────────────────────────────────────────
  - type: web
    name: meatec-auth-service
    env: node
    plan: free
    rootDir: auth-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: 12

  # ─── Passport Service ───────────────────────────────────────────────────────
  - type: web
    name: meatec-passport-service
    env: node
    plan: free
    rootDir: passport-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          name: meatec-auth-service
          type: web
          property: host
      - key: KAFKA_BROKERS
        sync: false

  # ─── Document Service ───────────────────────────────────────────────────────
  - type: web
    name: meatec-document-service
    env: node
    plan: free
    rootDir: document-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          name: meatec-auth-service
          type: web
          property: host
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false

  # ─── Notification Service ───────────────────────────────────────────────────
  - type: web
    name: meatec-notification-service
    env: node
    plan: free
    rootDir: notification-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: KAFKA_BROKERS
        sync: false
      - key: SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: noreply@meatec.com
      - key: NOTIFY_TO
        value: admin@meatec.com
